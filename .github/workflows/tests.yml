name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: La skill
        run: python -m unittest discover -s tests -v
      - name: Las puertas
        working-directory: skills/oficio/puertas-swift
        run: python -m unittest test_gates test_forma -v
